<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Advisor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">

            SmartExpense

        </div>

        <div class="nav-links">

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/budget">
                Budget Planner
            </a>

            <a href="/analytics">
                Analytics
            </a>

            <a href="/advisor">
                Advisor
            </a>

            <a href="/goals">
                Goals
            </a>

        </div>

    </nav>


    <div class="container">

        <h1>Smart Advisor</h1>


        <!-- INTRO CARD -->

        <div class="card advisor-header">

            <h2>

                Your Financial Assistant

            </h2>

            <p>

                Personalized recommendations
                based on your spending habits.

            </p>

        </div>


        <!-- ADVISOR MESSAGES -->

        {% for message in advisor_messages %}

            <div class="advisor-card">

                <div class="advisor-icon">

                    💡

                </div>

                <div class="advisor-text">

                    {{ message }}

                </div>

            </div>

        {% endfor %}

    </div>

</body>

</html>
