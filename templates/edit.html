<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Edit Expense</h1>

    <div class="card">

        <form action="/update/{{ expense.id }}"
              method="POST">

            <input type="text"
                   name="category"
                   value="{{ expense.category }}"
                   required>

            <input type="number"
                   name="amount"
                   value="{{ expense.amount }}"
                   required>

            <button type="submit">

                Save Changes

            </button>

        </form>

    </div>

</div>

</body>
</html>
