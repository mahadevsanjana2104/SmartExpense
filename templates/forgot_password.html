<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Reset Password</h1>

    <div class="card">

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required>

            <input
                type="password"
                name="password"
                placeholder="New Password"
                required>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm Password"
                required>

            <button type="submit">

                Reset Password

            </button>

        </form>

    </div>

</div>

</body>

</html>
