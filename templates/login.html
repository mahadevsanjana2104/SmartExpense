<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Welcome Back</h1>

    <div class="card">

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

        <br>
        
        <a href="/forgot-password">
            
            Forgot Password?
        
        </a>

        <a href="/signup">

            Don't have an account? Sign Up

        </a>

    </div>

</div>

</body>

</html>
